[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-kindle-dashboard"
version = "0.6.0"
description = "Local multi-device E-Ink dashboard gateway for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "Pillow>=10.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]
authors = [{name = "Nico Mancinelli"}]
keywords = ["hermes-agent", "kindle", "eink", "kual", "fbink"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/NicoMancinelli/hermes-eink-dashboard"
Issues = "https://github.com/NicoMancinelli/hermes-eink-dashboard/issues"

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[project.scripts]
hermes-kindle-dashboard = "hermes_kindle_dashboard.server:main"
hermes-dashboard-pair = "hermes_kindle_dashboard.pair_cli:main"

[tool.setuptools.packages.find]
where = ["src", "kindle"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
