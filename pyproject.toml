[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-kindle-dashboard"
version = "0.1.0"
description = "E-Ink Kindle dashboard for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]
authors = [{name = "Nico Mancinelli"}]
keywords = ["hermes-agent", "kindle", "eink", "kual", "fbink"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/NicoMancinelli/hermes-kindle-dashboard"
Issues = "https://github.com/NicoMancinelli/hermes-kindle-dashboard/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hermes-kindle-dashboard = "hermes_kindle_dashboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
