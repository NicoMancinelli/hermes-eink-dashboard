[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-eink-dashboard"
version = "1.0.0"
description = "Local multi-device E-Ink dashboard gateway for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "Pillow>=10.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]
authors = [{name = "Nico Mancinelli"}]
keywords = ["hermes-agent", "kindle", "eink", "kual", "fbink"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/NicoMancinelli/hermes-eink-dashboard"
Issues = "https://github.com/NicoMancinelli/hermes-eink-dashboard/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.scripts]
hermes-eink-dashboard = "hermes_eink_dashboard.server:main"
hermes-dashboard-pair = "hermes_eink_dashboard.pair_cli:main"

[tool.setuptools.packages.find]
where = ["src", "kindle"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
  "E501",   # long lines are handled by the formatter, not the linter
  "B008",   # FastAPI/Typer style calls in defaults
  "SIM108", # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/hermes_eink_dashboard"]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = false
