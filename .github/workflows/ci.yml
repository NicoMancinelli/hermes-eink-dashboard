name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Tests with coverage
        run: |
          pytest \
            --cov=hermes_eink_dashboard \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check src tests scripts kindle
      - name: Ruff format
        # The tree was reformatted wholesale once v1.0.0 was tagged, so the
        # release diff stayed readable. From here on the formatter is kept in
        # step automatically.
        run: ruff format --check src tests scripts kindle
      - name: Mypy
        run: mypy src/hermes_eink_dashboard

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kindle client scripts (POSIX sh / BusyBox)
        run: shellcheck -s sh kindle/hermes_dashboard/bin/*.sh
      - name: Host install scripts (bash)
        run: shellcheck scripts/install_host.sh scripts/uninstall_host.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Build wheel and sdist
        run: python -m build
      - name: Check the sdist and wheel are well-formed
        run: |
          python -m twine check dist/*
      - name: Verify no secrets and no retired aliases in the artifacts
        run: python scripts/verify_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Render both required E-Ink sizes
        run: |
          set -e
          for size in "600x800" "1072x1448"; do
            width="${size%x*}"
            height="${size#*x}"
            python -m hermes_eink_dashboard.server \
              --render-once "dist/render-${size}.png" \
              --width "$width" --height "$height"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: dist/*.png
          retention-days: 7

  kual-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Build template KUAL bundle
        run: python scripts/build_kual_bundle.py --output dist/hermes-dashboard-kual.zip
      - name: Verify the bundle contents
        run: python -m zipfile -l dist/hermes-dashboard-kual.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-dashboard-kual
          path: dist/hermes-dashboard-kual.zip
          retention-days: 7