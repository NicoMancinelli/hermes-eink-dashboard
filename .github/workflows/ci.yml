name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: ShellCheck
        run: shellcheck -s sh kindle/hermes_dashboard/bin/*.sh scripts/*.sh
      - name: Build template KUAL bundle artifact (main only)
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        run: python3 scripts/build_kual_bundle.py --output dist/hermes-dashboard-kual-main.zip
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        with:
          name: hermes-dashboard-kual-main
          path: dist/hermes-dashboard-kual-main.zip
